<rect class="green" x="370" y="180" width="190" height="95" rx="5"/><text class="t w" x="393" y="215">api.py</text><text class="sw" x="393" y="241">HTTP + background run</text>
<rect class="green" x="630" y="180" width="190" height="95" rx="5"/><text class="t w" x="653" y="215">agent.py</text><text class="sw" x="653" y="241">workflow coordinator</text>
