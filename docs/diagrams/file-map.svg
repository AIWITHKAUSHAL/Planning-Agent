<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Project file map</title><desc id="desc">Visual map showing how browser, API, orchestration, model, tools, and storage files relate.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#687069"/></marker><style>.bg{fill:#17201b}.group{fill:none;stroke:#627068;stroke-width:1}.box{fill:#f2efe7;stroke:#c9ff68;stroke-width:2}.green{fill:#276447;stroke:#c9ff68;stroke-width:2}.t{font:600 17px Manrope,Arial;fill:#17201b}.w{fill:#fff}.s{font:12px 'DM Mono',monospace;fill:#687069}.sw{font:12px 'DM Mono',monospace;fill:#dce2dd}.line{fill:none;stroke:#829087;stroke-width:2;marker-end:url(#a)}</style></defs>
<rect class="bg" width="1200" height="720"/><text x="55" y="58" font-family="Georgia" font-size="34" fill="#fff">How the files collaborate</text><text x="55" y="84" class="sw">ONE RESPONSIBILITY PER MODULE</text>
<rect class="group" x="45" y="115" width="250" height="530" rx="8"/><text class="sw" x="65" y="143">PRESENTATION</text>
<rect class="box" x="70" y="180" width="200" height="95" rx="5"/><text class="t" x="93" y="215">index.html</text><text class="s" x="93" y="241">screen structure</text>
<rect class="box" x="70" y="305" width="200" height="95" rx="5"/><text class="t" x="93" y="340">app.js</text><text class="s" x="93" y="366">submit + polling</text>
